<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learn `ls` — Visual Linux</title>
<style>
:root{
  --bg:#06120f;
  --txt:#e6f5ef;
  --dim:#8ba99d;
  --accent:#5eead4;
  --accent2:#a7f3d0;
  --blue:#67e8f9;
  --folder:#fbbf24;
  --file:#7dd3fc;
  --hidden:#f472b6;
  --err:#fb7185;
  --line:rgba(255,255,255,.11);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100dvh;
  font-family:var(--mono);color:var(--txt);background:var(--bg);
  overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(900px 600px at 8% -12%,rgba(94,234,212,.15),transparent 62%),
    radial-gradient(800px 620px at 100% 4%,rgba(103,232,249,.11),transparent 60%),
    radial-gradient(720px 700px at 48% 118%,rgba(251,191,36,.1),transparent 62%),
    #06120f;
}
body::after{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.026) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.026) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 15%,transparent 72%);
  mask-image:radial-gradient(ellipse at 50% 0%,#000 15%,transparent 72%);
}
.app{
  max-width:1320px;margin:0 auto;min-height:100dvh;
  display:flex;flex-direction:column;padding:14px 16px 16px;gap:11px;
}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:11px}
.logo{
  width:38px;height:38px;flex:0 0 auto;border-radius:11px;
  display:grid;place-items:center;font-size:20px;font-weight:700;color:#05221d;
  background:linear-gradient(150deg,#a7f3d0,#5eead4 45%,#2dd4bf);
  box-shadow:0 8px 22px -8px rgba(94,234,212,.9),inset 0 1px 0 rgba(255,255,255,.65);
  animation:logoPulse 3.2s ease-in-out infinite;
}
@keyframes logoPulse{
  0%,100%{box-shadow:0 8px 22px -8px rgba(94,234,212,.9),inset 0 1px 0 rgba(255,255,255,.65)}
  50%{box-shadow:0 8px 32px -6px rgba(94,234,212,1),inset 0 1px 0 rgba(255,255,255,.65)}
}
.brand h1{margin:0;font-size:16px;letter-spacing:.01em;font-weight:700}
.brand h1 code{
  color:#99f6e4;background:rgba(94,234,212,.14);padding:1px 7px;border-radius:6px;
  border:1px solid rgba(94,234,212,.28);
}
.brand p{margin:2px 0 0;font-size:11.5px;color:var(--dim)}
.steps{display:flex;gap:7px;align-items:center}
.steps i{
  width:9px;height:9px;border-radius:50%;display:block;background:rgba(255,255,255,.13);
  transition:all .45s cubic-bezier(.34,1.56,.64,1);
}
.steps i.done{
  background:var(--accent);box-shadow:0 0 0 4px rgba(94,234,212,.14),0 0 14px rgba(94,234,212,.7);
  transform:scale(1.15);
}
.mission{
  display:flex;align-items:center;gap:12px;padding:10px 13px;border-radius:14px;
  background:linear-gradient(90deg,rgba(94,234,212,.11),rgba(94,234,212,.02));
  border:1px solid rgba(94,234,212,.22);transition:background .35s,border-color .35s,transform .35s,box-shadow .35s;
}
.mission.complete{
  background:linear-gradient(90deg,rgba(74,222,128,.24),rgba(74,222,128,.05));
  border-color:rgba(74,222,128,.55);transform:scale(1.012);box-shadow:0 0 30px -8px rgba(74,222,128,.5);
}
.badge{
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;
  padding:5px 9px;border-radius:999px;white-space:nowrap;
  color:#99f6e4;background:rgba(94,234,212,.16);border:1px solid rgba(94,234,212,.3);transition:all .3s;
}
.mission.complete .badge{color:#86efac;background:rgba(74,222,128,.2);border-color:rgba(74,222,128,.45)}
.mission-text{flex:1;font-size:13px;line-height:1.4;min-width:0}
.mission-text b{color:#99f6e4}
.mission.complete .mission-text b{color:#86efac}
.hint-btn{
  font:inherit;font-size:11px;color:var(--dim);cursor:pointer;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.12);padding:6px 11px;border-radius:9px;white-space:nowrap;transition:.2s;
}
.hint-btn:hover{color:var(--txt);background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.24)}
.hint{
  max-height:0;overflow:hidden;opacity:0;font-size:12.5px;color:var(--dim);
  padding:0 14px;border-radius:12px;transition:max-height .3s ease,opacity .3s ease,padding .3s ease,background .3s;
}
.hint.show{max-height:80px;opacity:1;padding:9px 14px;background:rgba(255,255,255,.035)}
.hint code{color:#fde68a;background:rgba(251,191,36,.13);padding:1px 6px;border-radius:5px}
main{
  flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:13px;
}
.panel{
  background:linear-gradient(180deg,rgba(255,255,255,.048),rgba(255,255,255,.014));
  border:1px solid rgba(255,255,255,.08);border-radius:17px;padding:12px;
  display:flex;flex-direction:column;min-height:0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 22px 44px -24px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.055);
}
.panel-head{display:flex;align-items:center;gap:9px;padding:1px 4px 10px}
.title{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:700}
.sub{font-size:11px;color:rgba(139,169,157,.65);margin-left:auto}
.dots{display:flex;gap:5px;margin-right:2px}
.dots i{width:9px;height:9px;border-radius:50%;display:block}
.dots i:nth-child(1){background:#fb7185}
.dots i:nth-child(2){background:#fbbf24}
.dots i:nth-child(3){background:#4ade80}
.entry-count{
  margin-left:auto;display:flex;align-items:center;gap:5px;font-size:10.5px;color:#99f6e4;
  padding:4px 10px;border-radius:999px;background:rgba(94,234,212,.11);border:1px solid rgba(94,234,212,.24);
  transition:.3s;
}
.entry-count b{font-size:12.5px;color:var(--accent);min-width:10px;text-align:center}
.path-line{
  display:flex;align-items:center;gap:8px;min-height:37px;padding:7px 10px;margin-bottom:8px;
  border-radius:11px;background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.055);
}
.path-prompt{color:var(--accent2);font-size:12px;flex:0 0 auto}
.path-text{font-size:12px;color:#c7f9e8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.path-cursor{width:7px;height:15px;background:var(--accent);box-shadow:0 0 12px rgba(94,234,212,.7);animation:cursorBlink 1.15s steps(2,end) infinite;flex:0 0 auto}
@keyframes cursorBlink{50%{opacity:0}}
.filter-strip{
  display:flex;align-items:center;gap:6px;overflow-x:auto;padding:0 1px 8px;
  scrollbar-width:none;-ms-overflow-style:none;
}
.filter-strip::-webkit-scrollbar{display:none}
.filter-label{font-size:9.5px;letter-spacing:.1em;color:rgba(139,169,157,.6);flex:0 0 auto;margin-right:2px}
.filter-pill{
  font:inherit;font-size:10.5px;white-space:nowrap;padding:4px 8px;border-radius:999px;
  color:var(--dim);background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);transition:.2s;
}
.filter-pill.active{color:#06231d;background:var(--accent);border-color:var(--accent);box-shadow:0 0 15px rgba(94,234,212,.25)}
.directory-scroll{
  flex:1;min-height:0;overflow:auto;padding:2px 2px 8px;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent;-webkit-overflow-scrolling:touch;
}
.directory-scroll::-webkit-scrollbar{width:8px;height:8px}
.directory-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px}
.directory-scroll::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.26)}
.directory-stage{position:relative;min-height:100%;border-radius:13px;overflow:hidden}
.scan-beam{
  position:absolute;left:0;right:0;top:-38px;height:38px;z-index:5;pointer-events:none;opacity:0;
  background:linear-gradient(180deg,transparent,rgba(94,234,212,.1) 30%,rgba(94,234,212,.55) 50%,rgba(94,234,212,.1) 70%,transparent);
  border-top:1px solid rgba(94,234,212,.75);border-bottom:1px solid rgba(94,234,212,.3);
}
.directory-stage.scanning .scan-beam{animation:scanDown .9s cubic-bezier(.45,.05,.55,.95) both}
@keyframes scanDown{0%{top:-38px;opacity:0}12%{opacity:1}88%{opacity:1}100%{top:100%;opacity:0}}
.directory-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;padding:4px 2px 9px;position:relative;z-index:2}
.entry-card{
  min-width:0;position:relative;overflow:hidden;padding:11px;border-radius:13px;cursor:pointer;
  background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.075);
  animation:entryIn .48s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i) * 55ms);
  transition:transform .2s,border-color .2s,background .2s,box-shadow .2s;-webkit-tap-highlight-color:transparent;
}
@keyframes entryIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.entry-card:hover{transform:translateY(-3px);background:rgba(94,234,212,.07);border-color:rgba(94,234,212,.32);box-shadow:0 10px 24px -16px rgba(94,234,212,.5)}
.entry-card:active{transform:translateY(-1px) scale(.985)}
.entry-card::after{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:var(--blue);opacity:.65}
.entry-card.dir::after{background:var(--folder)}
.entry-card.hidden{opacity:.68;border-style:dashed;background:rgba(244,114,182,.035)}
.entry-card.hidden::after{background:var(--hidden)}
.entry-card.long{grid-column:span 2}
.entry-head{display:flex;align-items:center;gap:9px;min-width:0}
.entry-icon{
  width:34px;height:30px;flex:0 0 auto;position:relative;border-radius:5px;background:linear-gradient(180deg,#bae6fd,#38bdf8);
  box-shadow:0 5px 13px rgba(56,189,248,.2);transition:transform .25s,box-shadow .25s;
}
.entry-card:hover .entry-icon{transform:rotate(-4deg) scale(1.05)}
.entry-card.dir .entry-icon{background:linear-gradient(180deg,#fcd34d,#f59e0b);box-shadow:0 5px 13px rgba(251,191,36,.22)}
.entry-card.dir .entry-icon::before{content:'';position:absolute;left:0;top:-5px;width:15px;height:7px;border-radius:4px 4px 0 0;background:#fcd34d}
.entry-card.hidden .entry-icon{background:linear-gradient(180deg,#f9a8d4,#ec4899);box-shadow:0 5px 13px rgba(236,72,153,.2)}
.entry-card.hidden.dir .entry-icon{background:linear-gradient(180deg,#fcd34d,#f59e0b)}
.entry-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;color:#edfdf7;font-weight:700}
.entry-kind{margin-left:auto;flex:0 0 auto;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#7dd3fc}
.entry-card.dir .entry-kind{color:#fbbf24}
.entry-card.hidden .entry-kind{color:#f9a8d4}
.entry-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 9px;margin-top:10px;padding-top:9px;border-top:1px solid rgba(255,255,255,.07)}
.detail{display:flex;min-width:0;gap:5px;font-size:10px;color:var(--dim)}
.detail b{font-weight:400;color:rgba(139,169,157,.62);flex:0 0 auto}
.detail span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#b7d8cb}
.entry-card.long .entry-details{grid-template-columns:1.2fr 1fr .8fr 1fr}
.entry-card.long .entry-head{gap:10px}
.entry-card.long .entry-name{font-size:13.5px}
.entry-card.long .entry-icon{width:38px;height:33px}
.empty-state{
  min-height:180px;display:grid;place-items:center;text-align:center;color:var(--dim);font-size:12px;padding:25px;
  border:1px dashed rgba(255,255,255,.12);border-radius:13px;background:rgba(0,0,0,.16);
}
.empty-state b{display:block;color:#b7d8cb;font-size:14px;margin-bottom:6px}
.directory-foot{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 3px 0;color:var(--dim);font-size:10px;
}
.legend{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.legend-item{display:flex;align-items:center;gap:5px}
.legend-dot{width:7px;height:7px;border-radius:2px;background:var(--file);display:block}
.legend-dot.folder{background:var(--folder);border-radius:50%}
.legend-dot.hidden{background:var(--hidden);border-radius:50%}
.view-note{margin-left:auto;color:rgba(139,169,157,.62);text-align:right}
.term{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 13px;border-radius:12px;
  background:rgba(0,0,0,.36);border:1px solid rgba(255,255,255,.055);font-size:12.5px;line-height:1.7;
  scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent;-webkit-overflow-scrolling:touch;
}
.term::-webkit-scrollbar{width:8px;height:8px}
.term::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px}
.term::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.26)}
.line{white-space:pre-wrap;word-break:break-word;animation:lineIn .22s ease-out}
@keyframes lineIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.line .p{color:var(--accent2);opacity:.9}
.line .c{color:#f8fffc;font-weight:600}
.line.err{color:var(--err)}
.line .dir-name{color:#fbbf24;font-weight:600}
.line .file-name{color:#7dd3fc;font-weight:600}
.line .hidden-name{color:#f9a8d4;font-weight:600}
.line .dim{color:var(--dim)}
.line .ok{color:#86efac}
.line .hl{color:#99f6e4;font-weight:700}
.line .code{color:#fde68a;background:rgba(251,191,36,.11);padding:1px 7px;border-radius:6px;border:1px solid rgba(251,191,36,.2)}
.term-columns{display:flex;flex-wrap:wrap;gap:3px 18px;padding:3px 0 2px}
.term-columns .dir-name,.term-columns .file-name,.term-columns .hidden-name{min-width:76px}
.long-row{display:grid;grid-template-columns:104px 42px 42px 58px 82px minmax(0,1fr);gap:8px;align-items:baseline;padding:2px 0}
.long-row .perm{color:#c4b5fd;font-size:11px;white-space:nowrap}
.long-row .owner,.long-row .group{color:#b7d8cb;overflow:hidden;text-overflow:ellipsis}
.long-row .size{color:#fde68a;text-align:right;white-space:nowrap}
.long-row .date{color:var(--dim);white-space:nowrap}
.long-row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tip-line{margin-top:5px;padding:7px 10px;border-radius:8px;background:rgba(251,191,36,.08);border-left:3px solid rgba(251,191,36,.55);color:#fcd34d;font-size:12px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 1px 2px;scrollbar-width:none;-ms-overflow-style:none}
.chips::-webkit-scrollbar{display:none}
.chip{
  font:inherit;font-size:11.5px;white-space:nowrap;cursor:pointer;padding:6px 11px;border-radius:9px;
  color:#a7f3d0;background:rgba(94,234,212,.09);border:1px solid rgba(94,234,212,.24);transition:.18s;-webkit-tap-highlight-color:transparent;
}
.chip:hover{background:rgba(94,234,212,.2);transform:translateY(-1px);box-shadow:0 6px 16px -12px rgba(94,234,212,.9)}
.chip:active{transform:translateY(0) scale(.96)}
.input-row{
  display:flex;align-items:center;gap:8px;margin-top:9px;padding:9px 10px;border-radius:12px;background:rgba(0,0,0,.4);
  border:1px solid rgba(94,234,212,.25);transition:border-color .2s,box-shadow .2s;
}
.input-row:focus-within{border-color:rgba(94,234,212,.7);box-shadow:0 0 0 3px rgba(94,234,212,.13)}
.input-row.shake{animation:shake .4s}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
.ps1{font-size:12.5px;color:var(--accent2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.ps1 .ps-user{opacity:.8}
.input-row input{
  flex:1;min-width:40px;background:none;border:none;outline:none;color:#f1fff9;font:inherit;font-size:13px;padding:0;
}
.input-row input::placeholder{color:rgba(139,169,157,.5)}
.send{
  font:inherit;font-size:14px;line-height:1;cursor:pointer;width:30px;height:30px;flex:0 0 auto;border-radius:9px;
  color:#06231d;background:linear-gradient(150deg,#a7f3d0,#5eead4);border:none;display:grid;place-items:center;transition:.18s;
  box-shadow:0 4px 14px -4px rgba(94,234,212,.8);
}
.send:hover{transform:translateY(-1px);box-shadow:0 6px 18px -4px rgba(94,234,212,1)}
.send:active{transform:scale(.93)}
.confetti{position:fixed;top:-14px;width:8px;height:13px;border-radius:2px;z-index:999;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(108vh) rotate(var(--rot,360deg));opacity:.05}}
@media (min-width:901px){
  .term{flex:0 0 clamp(240px,42vh,420px);overflow-y:auto}
}
@media (max-width:900px){
  .app{padding:12px 12px 16px;gap:10px}
  main{grid-template-columns:1fr;grid-template-rows:auto auto;flex:none}
  .panel{min-height:0}
  .directory-panel{max-height:56vh}
  .directory-scroll{max-height:42vh}
  .term{min-height:155px;max-height:34vh}
  .brand h1{font-size:15px}
  .brand p,.sub{display:none}
  .mission-text{font-size:12.5px}
  .ps1 .ps-user{display:none}
}
@media (max-width:480px){
  .logo{width:34px;height:34px;font-size:18px}
  .badge{font-size:9px;padding:4px 7px}
  .mission{gap:8px;padding:9px 11px}
  .hint-btn{padding:5px 9px;font-size:10.5px}
  .entry-card{padding:9px}
  .entry-card.long{grid-column:span 1}
  .entry-card.long .entry-details{grid-template-columns:repeat(2,minmax(0,1fr))}
  .entry-details{gap:4px 7px}
  .path-line{padding:6px 8px}
  .long-row{grid-template-columns:96px 36px 36px 48px minmax(0,1fr);gap:5px;font-size:11px}
  .long-row .date{display:none}
  .view-note{width:100%;margin-left:0;text-align:left}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo">≡</div>
      <div>
        <h1>Learn <code>ls</code></h1>
        <p>See what is inside a directory — no experience needed.</p>
      </div>
    </div>
    <div class="steps" id="steps"></div>
  </header>

  <div class="mission" id="mission">
    <span class="badge" id="missionBadge">Mission 1 / 6</span>
    <span class="mission-text" id="missionText">Loading…</span>
    <button class="hint-btn" id="hintBtn" type="button">Hint</button>
  </div>
  <div class="hint" id="hintBar"></div>

  <main>
    <section class="panel directory-panel">
      <div class="panel-head">
        <span class="title">Directory lens</span>
        <span class="sub">tap a folder to explore</span>
        <span class="entry-count"><b id="entryCount">0</b> entries</span>
      </div>
      <div class="path-line">
        <span class="path-prompt">you@linux</span>
        <span class="path-text" id="pathText">~/projects</span>
        <span class="path-cursor" aria-hidden="true"></span>
      </div>
      <div class="filter-strip" aria-label="Listing view">
        <span class="filter-label">VIEW</span>
        <button class="filter-pill active" type="button" data-mode="plain">plain</button>
        <button class="filter-pill" type="button" data-mode="all">all</button>
        <button class="filter-pill" type="button" data-mode="long">long</button>
        <button class="filter-pill" type="button" data-mode="recent">recent</button>
        <button class="filter-pill" type="button" data-mode="reverse">reverse</button>
      </div>
      <div class="directory-scroll" id="directoryScroll">
        <div class="directory-stage" id="directoryStage">
          <div class="scan-beam" aria-hidden="true"></div>
          <div class="directory-grid" id="directoryGrid"></div>
          <div class="empty-state" id="emptyState" hidden><div><b>Nothing here yet</b>This directory is empty.</div></div>
        </div>
      </div>
      <div class="directory-foot">
        <div class="legend">
          <span class="legend-item"><i class="legend-dot folder"></i>folder</span>
          <span class="legend-item"><i class="legend-dot"></i>file</span>
          <span class="legend-item"><i class="legend-dot hidden"></i>hidden</span>
        </div>
        <span class="view-note" id="viewNote">plain listing</span>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">

</div>
<script>
const makeNode = (name, type = 'file', extra = {}) => {
  const node = {
    name, type, children:type === 'dir' ? [] : null, hidden:name.startsWith('.'),

  };

};
const ROOT = makeNode('/', 'dir');
const HOME_PARENT = makeNode('home', 'dir');
const HOME = makeNode('you', 'dir', {prettyName:'~'});

const API = makeNode('api', 'dir');
const DESIGN = makeNode('design-system', 'dir');
const ROUTES = makeNode('routes', 'dir');
const COMPONENTS = makeNode('components', 'dir');
const ARCHIVE = makeNode('.archive', 'dir');
const README = makeNode('README.md', 'file', {size:1840,mtime:202406141812,label:'Jun 14 18:12',owner:'you',group:'you'});
const INDEX = makeNode('index.html', 'file', {size:6420,mtime:202406130944,label:'Jun 13 09:44',owner:'you',group:'you'});
const PACKAGE = makeNode('package.json', 'file', {size:1280,mtime:202406121600,label:'Jun 12 16:00',owner:'you',group:'you'});

const CHANGELOG = makeNode('CHANGELOG.md', 'file', {size:3560,mtime:202406101530,label:'Jun 10 15:30',owner:'you',group:'you'});
const SERVER = makeNode('server.js', 'file', {size:4320,mtime:202406141006,label:'Jun 14 10:06',owner:'you',group:'you'});
const ROUTES_INDEX = makeNode('index.js', 'file', {size:2200,mtime:202406131420,label:'Jun 13 14:20',owner:'you',group:'you'});
const API_PACKAGE = makeNode('package.json', 'file', {size:940,mtime:202406121230,label:'Jun 12 12:30',owner:'you',group:'you'});
const TOKENS = makeNode('tokens.css', 'file', {size:3160,mtime:202406141720,label:'Jun 14 17:20',owner:'you',group:'you'});
const PREVIEW = makeNode('preview.png', 'file', {size:18400,mtime:202406091700,label:'Jun 09 17:00',owner:'you',group:'you'});
const DESIGN_README = makeNode('README.md', 'file', {size:1080,mtime:202406081300,label:'Jun 08 13:00',owner:'you',group:'you'});
const ARCHIVE_NOTE = makeNode('old-plan.txt', 'file', {size:790,mtime:202405221010,label:'May 22 10:10',owner:'you',group:'you'});
const NOTES = makeNode('notes.txt', 'file', {size:620,mtime:202406151200,label:'Jun 15 12:00',owner:'you',group:'you'});
const DOWNLOADS = makeNode('Downloads', 'dir');
const ETC = makeNode('etc', 'dir');
const HOSTS = makeNode('hosts', 'file', {size:220,mtime:202405300900,label:'May 30 09:00',owner:'root',group:'root'});

ROOT.children = [HOME_PARENT, ETC];
HOME_PARENT.children = [HOME, makeNode('.config', 'dir')];
HOME.children = [PROJECTS, NOTES, DOWNLOADS];
PROJECTS.children = [API, DESIGN, ARCHIVE, README, INDEX, PACKAGE, ENV, CHANGELOG];
API.children = [ROUTES, SERVER, API_PACKAGE];
ROUTES.children = [ROUTES_INDEX];
DESIGN.children = [COMPONENTS, TOKENS, PREVIEW, DESIGN_README];
COMPONENTS.children = [makeNode('button.css', 'file', {size:780,mtime:202406121000,label:'Jun 12 10:00',owner:'you',group:'you'})];
ARCHIVE.children = [ARCHIVE_NOTE];
ETC.children = [HOSTS];

const allNodes = [];
function link(node, parent) {
  node.parent = parent;
  allNodes.push(node);
  if (node.children) node.children.forEach(child => link(child, node));
}
ROOT.children.forEach(child => link(child, ROOT));
let cwd = PROJECTS;
let previousDir = HOME;
const nodeByName = new Map();
allNodes.forEach(node => nodeByName.set(node.name, node));

const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const directory = document.getElementById('directoryGrid');
const directoryStage = document.getElementById('directoryStage');
const directoryScroll = document.getElementById('directoryScroll');
const emptyState = document.getElementById('emptyState');
const pathText = document.getElementById('pathText');
const psPath = document.getElementById('psPath');
const entryCount = document.getElementById('entryCount');
const viewNote = document.getElementById('viewNote');
const filterPills = [...document.querySelectorAll('.filter-pill')];
const term = document.getElementById('term');
const chips = document.getElementById('chips');
const form = document.getElementById('form');
const input = document.getElementById('cmd');
const stepsEl = document.getElementById('steps');
const missionEl = document.getElementById('mission');
const missionBadge = document.getElementById('missionBadge');
const missionText = document.getElementById('missionText');
const hintBtn = document.getElementById('hintBtn');
const hintBar = document.getElementById('hintBar');

function absPath(node) {
  if (node === ROOT) return '/';
  const parts = [];
  let current = node;
  while (current && current !== ROOT) {
    parts.unshift(current.name);
    current = current.parent;
  }
  return '/' + parts.join('/');
}
function prettyPath(node) {
  if (!node) return '?';
  if (node === HOME) return '~';
  const absolute = absPath(node);
  if (absolute === '/home/you') return '~';
  if (absolute.startsWith('/home/you/')) return '~' + absolute.slice(9);
  return absolute;
}
function resolvePath(inputPath) {
  let current = inputPath === '~' || inputPath.startsWith('~/') ? HOME : inputPath.startsWith('/') ? ROOT : cwd;
  let rest = inputPath;
  if (inputPath === '~' || inputPath.startsWith('~/')) rest = inputPath.slice(1);
  if (inputPath.startsWith('/')) rest = inputPath.slice(1);
  const segments = rest.split('/').filter(Boolean);
  for (const segment of segments) {
    if (segment === '.') continue;
    if (segment === '..') { current = current.parent || ROOT; continue; }
    if (!current.children) return {error:'notdir', name:segment};
    const next = current.children.find(child => child.name === segment);
    if (!next) return {error:'missing', name:segment};
    current = next;
  }
  return {node:current};
}
function entriesFor(node, flags) {
  if (node.type !== 'dir') return [node];
  let entries = node.children.slice();
  if (!flags.a) entries = entries.filter(entry => !entry.hidden);
  entries.sort((left, right) => left.name.localeCompare(right.name, undefined, {numeric:true, sensitivity:'base'}));
  if (flags.t) entries.sort((left, right) => right.mtime - left.mtime);
  if (flags.r) entries.reverse();
  return entries;
}
function modeFor(node) {
  return node.type === 'dir' ? 'drwxr-xr-x' : node.hidden ? '-rw-------' : '-rw-r--r--';
}
function ownerFor(node) { return node.owner || 'you'; }
function groupFor(node) { return node.group || 'you'; }
function sizeFor(node) {
  if (node.type === 'dir') return 4096;
  return node.size || 1;
}
function sizeLabel(node, human) {
  const bytes = sizeFor(node);
  if (human) {
    if (bytes >= 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + 'M';
    if (bytes >= 1024) return Math.max(1, Math.round(bytes / 1024)) + 'K';
    return bytes + 'B';
  }
  if (bytes >= 1024 * 1024) return Math.max(1, Math.round(bytes / 1024 / 1024)) + 'M';
  return Math.max(1, Math.round(bytes / 1024)) + 'K';
}
function dateFor(node) { return node.label || 'Jun 01 09:00'; }
function displayName(node) {
  return node.type === 'dir' ? node.name + '/' : node.name;
}
function nameClass(node) { return node.hidden ? 'hidden-name' : node.type === 'dir' ? 'dir-name' : 'file-name'; }
function parseLs(args) {
  const flags = {a:false, l:false, t:false, r:false, one:false, h:false};
  const paths = [];
  let optionsEnded = false;
  for (const arg of args) {
    if (!optionsEnded && arg === '--') { optionsEnded = true; continue; }
    if (!optionsEnded && arg.startsWith('--')) {
      const longNames = {all:'a','almost-all':'a',long:'l','time-sort':'t',reverse:'r',oneline:'one','human-readable':'h'};
      const key = arg.slice(2).split('=')[0];
      if (!(key in longNames)) return {error:`unsupported option -- '${arg.slice(2)}'`};
      flags[longNames[key]] = true;
      continue;
    }
    if (!optionsEnded && arg.startsWith('-') && arg.length > 1) {
      for (const flag of arg.slice(1)) {
        if (!(flag in flags)) return {error:`invalid option -- '${flag}'`};
        flags[flag] = true;
      }
      continue;
    }
    paths.push(arg);
  }
  if (paths.length > 1) return {error:'this lesson lists one path at a time'};
  return {flags, path:paths[0] || '.'};
}
function log(html, className = '') {
  const line = document.createElement('div');
  line.className = 'line' + (className ? ' ' + className : '');
  line.innerHTML = html;
  term.appendChild(line);
  term.scrollTop = term.scrollHeight;
}
function shakeInput() {
  form.classList.remove('shake');
  void form.offsetWidth;
  form.classList.add('shake');
}
function updatePath() {
  const path = prettyPath(cwd);
  pathText.textContent = path;
  psPath.textContent = path;
}
function updateFilters(flags) {
  const active = [];
  if (flags.a) active.push('all');
  if (flags.l) active.push('long');
  if (flags.t) active.push('recent');
  if (flags.r) active.push('reverse');
  filterPills.forEach(pill => pill.classList.toggle('active', active.includes(pill.dataset.mode)));
  if (!active.length) filterPills[0].classList.add('active');
  const notes = [];
  if (flags.a) notes.push('hidden shown');
  if (flags.l) notes.push('long format');
  if (flags.t) notes.push('newest first');
  if (flags.r) notes.push('reversed');
  if (flags.one) notes.push('one per line');
  viewNote.textContent = notes.length ? notes.join(' · ') : 'plain listing';
}
function renderDirectory(entries, flags) {
  directory.innerHTML = '';
  entryCount.textContent = entries.length;
  updateFilters(flags);
  emptyState.hidden = entries.length !== 0;
  entries.forEach((node, index) => {
    const card = document.createElement('div');
    card.className = 'entry-card' + (node.type === 'dir' ? ' dir' : '') + (node.hidden ? ' hidden' : '') + (flags.l ? ' long' : '');
    card.style.setProperty('--i', index);
    card.tabIndex = 0;
    card.setAttribute('role', 'button');
    card.setAttribute('aria-label', `${node.type === 'dir' ? 'Folder' : 'File'} ${node.name}`);
    const kind = node.type === 'dir' ? 'folder' : 'file';
    const details = flags.l
      ? `<div class="entry-details"><div class="detail"><b>mode</b><span>${esc(modeFor(node))}</span></div><div class="detail"><b>owner</b><span>${esc(ownerFor(node))}</span></div><div class="detail"><b>size</b><span>${esc(sizeLabel(node, flags.h))}</span></div><div class="detail"><b>date</b><span>${esc(dateFor(node))}</span></div></div>`
      : `<div class="entry-details"><div class="detail"><b>type</b><span>${kind}</span></div><div class="detail"><b>size</b><span>${esc(sizeLabel(node, flags.h))}</span></div></div>`;
    card.innerHTML = `<div class="entry-head"><span class="entry-icon"></span><span class="entry-name">${esc(node.name)}</span><span class="entry-kind">${node.hidden ? 'hidden' : kind}</span></div>${details}`;
    const inspect = () => {
      if (node.type === 'dir') {
        const command = node.parent === cwd ? `cd ${node.name}` : `cd ${prettyPath(node)}`;
        execute(command);
      } else {
        const filePath = node.parent === cwd ? node.name : prettyPath(node);
        execute(`ls ${filePath}`);
      }
      input.focus();
    };
    card.addEventListener('click', inspect);
    card.addEventListener('keydown', event => {
      if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); inspect(); }
    });
    directory.appendChild(card);
  });
  directoryStage.classList.remove('scanning');
  void directoryStage.offsetWidth;
  directoryStage.classList.add('scanning');
  window.setTimeout(() => directoryStage.classList.remove('scanning'), 1000);
}
function renderLong(entries, flags) {
  const rows = entries.map(node => {
    const className = nameClass(node);
    return `<div class="long-row"><span class="perm">${esc(modeFor(node))}</span><span class="owner">${esc(ownerFor(node))}</span><span class="group">${esc(groupFor(node))}</span><span class="size">${esc(sizeLabel(node, flags.h))}</span><span class="date">${esc(dateFor(node))}</span><span class="name ${className}">${esc(displayName(node))}</span></div>`;
  }).join('');
  log(rows, 'output');
}
function renderListing(entries, flags) {
  if (!entries.length) { log('<span class="dim">(empty)</span>'); return; }
  if (flags.l) { renderLong(entries, flags); return; }
  if (flags.one) {
    entries.forEach(node => log(`<span class="${nameClass(node)}">${esc(displayName(node))}</span>`));
    return;
  }
  const items = entries.map(node => `<span class="${nameClass(node)}">${esc(displayName(node))}</span>`).join('');
  log(`<span class="term-columns">${items}</span>`, 'output');
}
function doLs(args) {
  const parsed = parseLs(args);
  if (parsed.error) {
    log(`ls: ${esc(parsed.error)}`, 'err');
    log('<span class="tip-line">Try one of the view buttons above, or type <b>ls --help</b>.</span>', 'tip-line-wrap');
    shakeInput();
    return;
  }
  const target = resolvePath(parsed.path);
  if (target.error) {
    if (target.error === 'missing') log(`ls: cannot access '${esc(parsed.path)}': No such file or directory`, 'err');
    else log(`ls: cannot access '${esc(parsed.path)}': Not a directory`, 'err');
    shakeInput();
    return;
  }
  const node = target.node;
  const entries = entriesFor(node, parsed.flags);
  renderDirectory(entries, parsed.flags);
  renderListing(entries, parsed.flags);
  if (node.type === 'dir') {
    const hiddenCount = node.children.filter(child => child.hidden).length;
    const visibleCount = node.children.length - hiddenCount;
    if (parsed.flags.a && hiddenCount) log(`<span class="dim">${hiddenCount} hidden ${hiddenCount === 1 ? 'entry' : 'entries'} revealed.</span>`);
    if (!parsed.flags.a && hiddenCount) log(`<span class="dim">${hiddenCount} hidden ${hiddenCount === 1 ? 'entry is' : 'entries are'} tucked away. Try <b>ls -a</b>.</span>`);
    if (entries.length === visibleCount && !parsed.flags.l && !parsed.flags.t && !parsed.flags.r && !parsed.flags.one) log('<span class="dim">Names appear in alphabetical order.</span>');
  }
  lastContext = {command:'ls', flags:parsed.flags, path:node, entries, commandLine:args.join(' ')};
  checkMission();
}
function doCd(args) {
  let target;
  if (!args.length) target = HOME;
  else if (args[0] === '-') {
    if (!previousDir) { log('bash: cd: OLDPWD not set', 'err'); return; }
    target = previousDir;
    log(`<span class="dim">${esc(prettyPath(target))}</span>`);
  } else {
    const result = resolvePath(args[0]);
    if (result.error === 'missing') { log(`bash: cd: ${esc(args[0])}: No such directory`, 'err'); shakeInput(); return; }
    if (result.error === 'notdir' || result.node.type !== 'dir') { log(`bash: cd: ${esc(args[0])}: Not a directory`, 'err'); shakeInput(); return; }
    target = result.node;
  }
  if (target === cwd) { log('<span class="dim">You are already there.</span>'); return; }
  previousDir = cwd;
  cwd = target;
  updatePath();
  renderDirectory(entriesFor(cwd, {a:false}), {a:false});
  log(`<span class="ok">Now in ${esc(prettyPath(cwd))}</span>`);
}
function doPwd() { log(esc(prettyPath(cwd))); }
function doHelp() {
  log('<span class="ok">Listing commands you can try:</span>');
  log('  <span class="dir-name">ls</span>             list visible entries');
  log('  <span class="dir-name">ls -a</span>          include hidden entries');
  log('  <span class="dir-name">ls -l</span>          show permissions, owner, size, and date');
  log('  <span class="dir-name">ls -t</span>          sort newest first');
  log('  <span class="dir-name">ls -r</span>          reverse the order');
  log('  <span class="dir-name">ls -1</span>          print one entry per line');
  log('  <span class="dir-name">ls -la</span>         combine flags');
  log('  <span class="dir-name">ls PATH</span>        inspect another folder');
  log('  <span class="dir-name">cd / pwd</span>       move around and print the current path');
}
function execute(raw) {
  const commandLine = raw.trim();
  if (!commandLine) return;
  history.push(commandLine);
  historyIndex = -1;
  const prompt = `you@linux:${prettyPath(cwd)}$`;
  log(`<span class="p">${esc(prompt)}</span> <span class="c">${esc(commandLine)}</span>`);
  if (commandLine === 'clear') { term.innerHTML = ''; return; }
  if (commandLine === 'help' || commandLine === '--help' || commandLine === '-h') { doHelp(); return; }
  const parts = commandLine.match(/(?:[^\s"']+|"[^"]*"|'[^']*')+/g) || [];
  const command = parts[0];
  const args = parts.slice(1).map(arg => arg.replace(/^"|"$/g, '').replace(/^'|'$/g, ''));
  if (command === 'ls' && args.includes('--help')) { doHelp(); return; }
  if (command === 'ls') doLs(args);
  else if (command === 'cd') doCd(args);
  else if (command === 'pwd') doPwd();
  else {
    log(`bash: ${esc(command)}: command not found`, 'err');
    log('<span class="dim">This playground is learning <b>ls</b>. Try a view flag above.</span>');
    shakeInput();
  }
}
const missions = [
  {text:'List the visible entries in <b>~/projects</b>.', hint:'Type: <code>ls</code>', answer:'ls', check:context => context.command === 'ls' && !context.flags.a && !context.flags.l && !context.flags.t && !context.flags.r && !context.flags.one},
  {text:'Reveal the entries whose names start with a dot.', hint:'Hidden entries start with a dot. Type: <code>ls -a</code>', answer:'ls -a', check:context => context.command === 'ls' && context.flags.a},
  {text:'Show permissions, owner, size, and modified date.', hint:'The long view uses <code>-l</code>. Type: <code>ls -l</code>', answer:'ls -l', check:context => context.command === 'ls' && context.flags.l},
  {text:'Put the newest entries at the top.', hint:'The <code>-t</code> flag sorts by time. Type: <code>ls -t</code>', answer:'ls -t', check:context => context.command === 'ls' && context.flags.t},
  {text:'Reverse the normal alphabetical order.', hint:'The <code>-r</code> flag reverses sorting. Type: <code>ls -r</code>', answer:'ls -r', check:context => context.command === 'ls' && context.flags.r},
  {text:'Combine hidden files with the long view.', hint:'Short flags can be joined. Type: <code>ls -la</code>', answer:'ls -la', check:context => context.command === 'ls' && context.flags.a && context.flags.l}
];
let missionIndex = 0;
let missionLocked = false;
let history = [];
let historyIndex = -1;
let lastContext = null;
missions.forEach(() => stepsEl.appendChild(document.createElement('i')));
function renderMission() {
  const mission = missions[missionIndex];
  missionBadge.textContent = `Mission ${missionIndex + 1} / ${missions.length}`;
  missionText.innerHTML = mission.text;
  hintBar.classList.remove('show');
  hintBar.textContent = '';
  renderChips();
}
function checkMission() {
  if (missionLocked || missionIndex >= missions.length || !lastContext) return;
  if (missions[missionIndex].check(lastContext)) completeMission();
}
function completeMission() {
  missionLocked = true;
  stepsEl.children[missionIndex].classList.add('done');
  missionEl.classList.add('complete');
  window.setTimeout(() => {
    missionEl.classList.remove('complete');
    missionIndex++;
    missionLocked = false;
    if (missionIndex >= missions.length) finishAll();
    else renderMission();
  }, 950);
}
function finishAll() {
  missionBadge.textContent = 'All done';
  missionText.innerHTML = 'You can read a directory like a pro. Try exploring on your own!';
  hintBtn.style.display = 'none';
  hintBar.classList.remove('show');
  renderChips();
  confetti();
  log('<span class="ok">All missions complete — nicely done!</span>');
}
function confetti() {
  const colors = ['#5eead4','#67e8f9','#fbbf24','#f472b6','#a7f3d0','#86efac'];
  for (let i = 0; i < 55; i++) {
    const piece = document.createElement('i');
    piece.className = 'confetti';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[i % colors.length];
    piece.style.animationDelay = (Math.random() * .45) + 's';
    piece.style.animationDuration = (1.7 + Math.random() * 1.3) + 's';
    piece.style.setProperty('--rot', (Math.random() * 900 - 450) + 'deg');
    document.body.appendChild(piece);
    window.setTimeout(() => piece.remove(), 3600);
  }
}
const chipPool = ['ls','ls -a','ls -l','ls -t','ls -r','ls -1','ls -la','ls api','help','pwd'];
function renderChips() {
  chips.innerHTML = '';
  const mission = missions[Math.min(missionIndex, missions.length - 1)];
  const candidates = chipPool.filter(command => command !== mission.answer);
  const offset = (missionIndex * 3) % candidates.length;
  const list = candidates.slice(offset).concat(candidates.slice(0, offset)).slice(0, 4);
  if (hintBar.classList.contains('show')) list.unshift(mission.answer);
  list.forEach(command => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'chip';
    button.textContent = command;
    button.addEventListener('click', () => { execute(command); input.focus(); });
    chips.appendChild(button);
  });
}
hintBtn.addEventListener('click', () => {
  if (hintBar.classList.contains('show')) {
    hintBar.classList.remove('show');
    renderChips();
    return;
  }
  const mission = missions[Math.min(missionIndex, missions.length - 1)];
  hintBar.innerHTML = mission.hint;
  hintBar.classList.add('show');
  renderChips();
});
form.addEventListener('submit', event => {
  event.preventDefault();
  const value = input.value;
  input.value = '';
  execute(value);
  input.focus();
});
input.addEventListener('keydown', event => {
  if (event.key === 'ArrowUp') {
    event.preventDefault();
    if (historyIndex < history.length - 1) {
      historyIndex++;
      input.value = history[history.length - 1 - historyIndex];
      input.setSelectionRange(input.value.length, input.value.length);
    }
  } else if (event.key === 'ArrowDown') {
    event.preventDefault();
    if (historyIndex > 0) {
      historyIndex--;
      input.value = history[history.length - 1 - historyIndex];
    } else {
      historyIndex = -1;
      input.value = '';
    }
  }
});
filterPills.forEach(pill => pill.addEventListener('click', () => {
  const mode = pill.dataset.mode;
  const commands = {plain:'ls',all:'ls -a',long:'ls -l',recent:'ls -t',reverse:'ls -r'};
  execute(commands[mode]);
  input.focus();
}));

updatePath();
renderDirectory(entriesFor(cwd, {a:false}), {a:false});
renderMission();
log('<span class="hl">Welcome to the visual ls terminal.</span>');
log('The directory lens on the left shows what <b>ls</b> sees.');
log('Use flags to change the view — the terminal and cards stay in sync.');
log('');
log('<span class="dim">Try this first:</span> <span class="code">ls</span>');
if (!('ontouchstart' in window) && window.innerWidth > 900) window.setTimeout(() => input.focus(), 400);
</script>
