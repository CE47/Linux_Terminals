.icon{width:18px;height:14px;flex:0 0 auto;position:relative;border-radius:3px;transition:box-shadow .3s}.icon.dir{background:linear-gradient(180deg,#fcd34d,#f59e0b);box-shadow:0 2px 7px rgba(251,191,36,.22)}.icon.dir::before{content:'';position:absolute;top:-4px;left:0;width:8px;height:6px;background:#fcd34d;border-radius:3px 3px 0 0}.icon.file{background:linear-gradient(180deg,#c7d2fe,#818cf8);border-radius:2px 5px 2px 2px;box-shadow:0 2px 8px rgba(129,140,248,.2)}.row.current .icon.dir{box-shadow:0 0 0 3px rgba(129,140,248,.28),0 2px 12px rgba(251,191,36,.75)}.row.selected .icon.file{box-shadow:0 0 0 3px rgba(103,232,249,.2),0 2px 12px rgba(103,232,249,.5)}.label{font-size:13.5px;letter-spacing:.01em}.tag{font-size:9.5px;padding:2px 6px;border-radius:99px;font-weight:700;background:rgba(74,222,128,.16);color:#86efac;border:1px solid rgba(74,222,128,.3)}
.avatar{position:absolute;left:0;top:0;width:30px;height:30px;z-index:6;pointer-events:none;transition:transform .62s cubic-bezier(.34,1.3,.64,1);will-change:transform}.avatar .body{width:100%;height:100%;border-radius:50% 50% 46% 46%;background:radial-gradient(circle at 34% 28%,#bae6fd,#67e8f9 52%,#0891b2);box-shadow:0 0 0 3px rgba(103,232,249,.16),0 9px 20px -4px rgba(8,145,178,.75);display:grid;place-items:center;animation:idle 2.8s ease-in-out infinite}.avatar.hop .body{animation:hop .58s cubic-bezier(.34,1.3,.64,1)}@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5px)}}@keyframes hop{0%{transform:translateY(0) scale(1,1)}28%{transform:translateY(-11px) scale(.9,1.12)}58%{transform:translateY(0) scale(1.12,.88)}80%{transform:translateY(-3px) scale(.98,1.03)}100%{transform:translateY(0) scale(1,1)}}.eyes{display:flex;gap:5px}.eyes i{width:4px;height:6.5px;background:#082f49;border-radius:50%;display:block;animation:blink 4.6s infinite}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}.ping{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;z-index:4}.ping i{position:absolute;left:-17px;top:-17px;width:34px;height:34px;border-radius:50%;border:2px solid rgba(103,232,249,.85);display:block;animation:pingA .75s ease-out forwards}@keyframes pingA{0%{transform:scale(.2);opacity:1}100%{transform:scale(1.9);opacity:0}}
.term{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px 13px;border-radius:12px;background:rgba(0,0,0,.36);border:1px solid rgba(255,255,255,.055);font-size:12.5px;line-height:1.7;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.16) transparent;-webkit-overflow-scrolling:touch}.term::-webkit-scrollbar{width:8px;height:8px}.term::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px}.term::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.26)}.line{white-space:pre-wrap;word-break:break-word;animation:lineIn .22s ease-out}@keyframes lineIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}.line .p{color:#a7f3d0;opacity:.9}.line .c{color:#f8faff;font-weight:600}.line.err{color:var(--err)}.line .dim{color:var(--dim)}.line .ok{color:#86efac}.line .hl{color:#c7d2fe;font-weight:700}.line .code{color:#fde68a;background:rgba(251,191,36,.11);padding:1px 7px;border-radius:6px;border:1px solid rgba(251,191,36,.2)}.line-no{color:#fbbf24;opacity:.75;margin-right:12px}.line-end{color:#67e8f9;opacity:.7;margin-left:3px}.file-separator{color:#a5b4fc;font-size:10.5px;letter-spacing:.04em;margin-top:3px;padding:4px 7px;border-left:2px solid rgba(165,180,252,.55);background:rgba(129,140,248,.06)}.cat-text{color:#dbe4ff}.cat-text.strong{color:#fcd34d;font-weight:700}.tip-line{margin-top:4px;padding:6px 10px;border-radius:8px;background:rgba(251,191,36,.08);border-left:3px solid rgba(251,191,36,.55);color:#fcd34d;font-size:12px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 1px 2px;scrollbar-width:none;-ms-overflow-style:none}.chips::-webkit-scrollbar{display:none}.chip{font:inherit;font-size:11.5px;white-space:nowrap;cursor:pointer;padding:6px 11px;border-radius:9px;color:#c7d2fe;background:rgba(129,140,248,.1);border:1px solid rgba(129,140,248,.25);transition:.18s;-webkit-tap-highlight-color:transparent}.chip:hover{background:rgba(129,140,248,.22);color:#e0e7ff;transform:translateY(-1px);box-shadow:0 6px 16px -12px rgba(129,140,248,.9)}.chip:active{transform:translateY(0) scale(.96)}
.input-row{display:flex;align-items:center;gap:8px;margin-top:9px;padding:9px 10px;border-radius:12px;background:rgba(0,0,0,.4);border:1px solid rgba(129,140,248,.25);transition:border-color .2s,box-shadow .2s}.input-row:focus-within{border-color:rgba(129,140,248,.7);box-shadow:0 0 0 3px rgba(129,140,248,.13)}.input-row.shake{animation:shake .4s}@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}.ps1{font-size:12.5px;color:#a7f3d0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}.ps1 .ps-user{color:#a7f3d0;opacity:.85}.input-row input{flex:1;min-width:40px;background:none;border:none;outline:none;color:#f1f3ff;font:inherit;font-size:13px;padding:0}.input-row input::placeholder{color:rgba(146,150,183,.5)}.send{font:inherit;font-size:14px;line-height:1;cursor:pointer;width:30px;height:30px;flex:0 0 auto;border-radius:9px;color:#111331;background:linear-gradient(150deg,#c7d2fe,#818cf8);border:none;display:grid;place-items:center;transition:.18s;box-shadow:0 4px 14px -4px rgba(129,140,248,.8)}.send:hover{transform:translateY(-1px);box-shadow:0 6px 18px -4px rgba(129,140,248,1)}.send:active{transform:scale(.93)}.confetti{position:fixed;top:-14px;width:8px;height:13px;border-radius:2px;z-index:999;pointer-events:none;animation:fall linear forwards}@keyframes fall{to{transform:translateY(108vh) rotate(var(--rot,360deg));opacity:.05}}
@media (min-width:901px){.term{flex:0 0 clamp(240px,42vh,420px);overflow-y:auto}}

<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo">▤</div>
      <div>
        <h1>Learn <code>cat</code></h1>
        <p>Read text files from the terminal — no experience needed.</p>
      </div>
    </div>
    <div class="steps" id="steps"></div>
  </header>
  <div class="mission" id="mission">
    <span class="badge" id="missionBadge">Mission 1 / 6</span>
    <span class="mission-text" id="missionText">Loading…</span>
    <button class="hint-btn" id="hintBtn" type="button">Hint</button>
  </div>
  <div class="hint" id="hintBar"></div>
  <main>
    <section class="panel">
      <div class="panel-head">
        <span class="title">Filesystem map</span>
        <span class="sub">tap a folder to jump · tap a file to read</span>
      </div>
      <div class="crumbs" id="crumbs"></div>
      <div class="file-lens" id="fileLens">
        <span class="lens-icon" id="lensIcon">▤</span>
        <div class="lens-copy">
          <span class="lens-name" id="fileName">notes.txt</span>
          <span class="lens-meta" id="fileMeta">4 lines · 1.8 KB</span>
          <span class="lens-status" id="fileStatus">selected file · ready to read</span>
        </div>
        <div class="lens-bars" id="lensBars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
      <div class="tree-scroll" id="treeScroll">
        <div class="tree" id="tree"></div>
      </div>
    </section>
    <section class="panel">
      <div class="panel-head">
        <span class="dots"><i></i><i></i><i></i></span>
        <span class="title">Terminal</span>
      </div>
      <div class="term" id="term"></div>
      <div class="chips" id="chips"></div>
      <form class="input-row" id="form" autocomplete="off">
        <span class="ps1" id="ps1"><span class="ps-user">you@linux:</span><span id="psPath">~</span>$</span>
        <input id="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="type cat…">
        <button class="send" type="submit" aria-label="Run command">↵</button>
      </form>
    </section>
  </main>
</div>
<script>
let nodeClock = 1700000000000;
const mk = (name, type = 'dir', extra = {}) => ({name, type, children:type === 'dir' ? [] : null, content:type === 'file' ? [] : null, hidden:name.startsWith('.'), mtime:nodeClock++, size:type === 'dir' ? 4096 : 1, ...extra});
const ROOT = mk('/');
const homeDir = mk('home');
const HOME = mk('you');
const documents = mk('documents');
const projects = mk('projects');
const pictures = mk('pictures');
const music = mk('music');
const etc = mk('etc');
const notes = mk('notes.txt', 'file', {size:1840, content:['Welcome to the command lab.','Keep these lines short.','cat reads files without opening an editor.','Try one command at a time.']});
const readme = mk('README.md', 'file', {size:980, content:['# Command Lab','Files are little containers for text.','cat simply prints what is inside.']});
const env = mk('.env', 'file', {size:420, content:['APP_ENV=demo','PORT=8080']});
const projectFile = mk('project.txt', 'file', {size:760, content:['Project Atlas','The file lives inside documents.','Line three is here on purpose.','Read me with cat.']});
const codeFile = mk('main.js', 'file', {size:2320, content:['const answer = 42;','console.log(answer);']});
const pictureFile = mk('mountains.txt', 'file', {size:610, content:['blue ridge','morning light']});
const musicFile = mk('playlist.txt', 'file', {size:510, content:['ambient focus','night drive']});
const hosts = mk('hosts', 'file', {size:220, content:['127.0.0.1 localhost','::1 localhost ip6-localhost']});

ROOT.children = [homeDir, etc];
homeDir.children = [HOME];
HOME.children = [documents, projects, pictures, music, notes, readme, env];
documents.children = [projectFile, projects];
projects.children = [codeFile];
pictures.children = [pictureFile];
music.children = [musicFile];
etc.children = [hosts];
const rowOf = new Map();
function link(node, parent) {
  node.parent = parent;
  if (node.children) node.children.forEach(child => link(child, node));
}
ROOT.children.forEach(child => link(child, ROOT));
let cwd = HOME;
let previousDir = HOME;
let selectedFile = notes;
let lastContext = null;
let history = [];
let historyIndex = -1;
const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));

function absPath(node) { if (node === ROOT) return '/'; const parts = []; let current = node; while (current && current !== ROOT) { parts.unshift(current.name); current = current.parent; } return '/' + parts.join('/'); }

function flashRow(node) { const row = rowOf.get(node); row.classList.remove('flash'); void row.offsetWidth; row.classList.add('flash'); }

function updateUI() { rowOf.forEach((row,node) => { row.classList.toggle('current',node===cwd); row.classList.toggle('selected',node===selectedFile); }); psPath.textContent = prettyPath(cwd); renderCrumbs(); renderChips(); updateLens(); }
function renderCrumbs() { crumbs.innerHTML = ''; const path = prettyPath(cwd); const parts = path === '/' ? ['/'] : (path.startsWith('~') ? ['/', 'home', 'you', ...path.slice(1).split('/').filter(Boolean)] : ['/', ...path.split('/').filter(Boolean)]); parts.forEach((part,index) => { if (index) { const separator = document.createElement('span'); separator.className = 'sep'; separator.textContent = '›'; crumbs.appendChild(separator); } const crumb = document.createElement('span'); crumb.className = 'crumb'; crumb.style.animationDelay = `${index * 45}ms`; crumb.textContent = part === 'you' ? '~' : part; crumbs.appendChild(crumb); }); }
function updateLens() { if (!selectedFile) return; fileLens.classList.add('active'); lensIcon.textContent = selectedFile.name.endsWith('.md') ? '✦' : '▤'; fileName.textContent = selectedFile.name; fileMeta.textContent = `${selectedFile.content.length} lines · ${sizeLabel(selectedFile)}`; fileStatus.textContent = `${prettyPath(selectedFile)} · ready to read`; [...lensBars.children].forEach((bar,index) => { bar.style.animationDelay = `${index * 70}ms`; }); }

function parseCat(args) {

function printCat(files, flags) {

function doCd(args) {

function parseLs(args) {

  const paths = [];

    if (arg === '--help') return {help:true};
    if (!optionsEnded && arg === '--') { optionsEnded = true; continue; }

      const names = {all:'a','almost-all':'a',long:'l','time-sort':'t',reverse:'r',oneline:'one','human-readable':'h'};
      const key = arg.slice(2).split('=')[0];
      if (!(key in names)) return {error:`unsupported option -- '${arg.slice(2)}'`};

function listEntries(node, flags) {

function execute(raw) { const commandLine = raw.trim(); if (!commandLine) return; history.push(commandLine); historyIndex = -1; const prompt = `you@linux:${prettyPath(cwd)}$`; log(`<span class="p">${esc(prompt)}</span> <span class="c">${esc(commandLine)}</span>`); if (commandLine === 'clear') { term.innerHTML = ''; return; } if (commandLine === 'help' || commandLine === '--help') { showHelp(); return; } const parts = commandLine.match(/(?:[^\s"']+|"[^"]*"|'[^']*')+/g) || []; const command = parts[0]; const args = parts.slice(1).map(arg => arg.replace(/^"|"$/g,'').replace(/^'|'$/g,'')); if (command === 'cat') doCat(args); else if (command === 'cd') doCd(args); else if (command === 'ls') doLs(args); else if (command === 'pwd') doPwd(args); else { log(`bash: ${esc(command)}: command not found`, 'err'); log('<span class="dim">This playground is learning <b>cat</b>. Try a filename above.</span>'); shakeInput(); } }
function renderChips() { chips.innerHTML = ''; const mission = missions[Math.min(missionIndex,missions.length-1)]; const commands = ['cat notes.txt','cat -n notes.txt','cat ~/notes.txt','cat /etc/hosts','cat ~/notes.txt ~/README.md','ls','pwd','help'].filter(command=>command!==mission.answer); if (missionIndex === 2) commands.unshift('cd documents','cat project.txt'); if (missionIndex === 0) commands.unshift('cat notes.txt'); const list = commands.slice(0,5); if (hintBar.classList.contains('show') && !list.includes(mission.answer)) list.unshift(mission.answer); list.forEach(command => { const button = document.createElement('button'); button.type = 'button'; button.className = 'chip'; button.textContent = command; button.addEventListener('click',()=>{execute(command);input.focus();}); chips.appendChild(button); }); }
